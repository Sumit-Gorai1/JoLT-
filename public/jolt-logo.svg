<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jolt-frame" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="jolt-glass" x1="36" y1="28" x2="220" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#eef4ff" stop-opacity="0.90" />
    </linearGradient>
    <linearGradient id="jolt-bolt" x1="72" y1="40" x2="184" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="52%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="jolt-facet" x1="128" y1="42" x2="186" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.16" />
    </linearGradient>
    <linearGradient id="jolt-wave" x1="42" y1="184" x2="218" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#14b8a6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="1" />
    </linearGradient>
    <filter id="soft-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer Crystal Prism Bezel -->
  <rect x="20" y="20" width="216" height="216" rx="56" fill="url(#jolt-frame)" filter="url(#soft-glow)" />
  <!-- Inner Frosted Glass Surface -->
  <rect x="30" y="30" width="196" height="196" rx="48" fill="url(#jolt-glass)" stroke="#ffffff" stroke-width="2" />

  <!-- Kinetic Market Signal Path -->
  <path
    d="M46 180 L84 148 L110 162 L158 104 L182 118 L212 80"
    stroke="url(#jolt-wave)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Sculpted Lightning Bolt Prism -->
  <path
    d="M148 44 L76 136 H124 L106 212 L182 114 H134 L148 44 Z"
    fill="url(#jolt-bolt)"
    stroke="#ffffff"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Crystal Specular Facet -->
  <path
    d="M148 44 L124 136 H134 L182 114 H134 L148 44 Z"
    fill="url(#jolt-facet)"
  />

  <!-- Signal Apex Spark -->
  <circle cx="212" cy="80" r="8" fill="#14b8a6" stroke="#ffffff" stroke-width="2.5" />
</svg>
